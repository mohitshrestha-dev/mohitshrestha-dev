<svg width="1000" height="250" viewBox="0 0 1000 250" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap');
    
    .text-title {
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 16px;
      fill: #FFFFFF;
    }
    
    .text-sub {
      font-family: 'Inter', sans-serif;
      font-weight: 400;
      font-size: 12px;
      fill: #8B949E;
    }

    .glass-card {
      fill: rgba(255, 255, 255, 0.03);
      stroke: rgba(255, 255, 255, 0.1);
      stroke-width: 1;
      rx: 12px;
    }

    .bar-bg { fill: rgba(255, 255, 255, 0.1); rx: 4px; }
    
    .bar-fill-1 { fill: #FF5700; filter: url(#glow); rx: 4px; animation: load1 2s ease-out forwards; }
    .bar-fill-2 { fill: #00E5FF; filter: url(#glow); rx: 4px; animation: load2 2.5s ease-out forwards; }
    .bar-fill-3 { fill: #181CB8; filter: url(#glow); rx: 4px; animation: load3 2s ease-out forwards; }

    @keyframes load1 { from { width: 0; } to { width: 220px; } } /* 75% */
    @keyframes load2 { from { width: 0; } to { width: 260px; } } /* 90% */
    @keyframes load3 { from { width: 0; } to { width: 180px; } } /* 60% */
  </style>

  <!-- Background -->
  <rect width="1000" height="250" fill="#0D1117" />
  
  <!-- Card 1: Mission Progress -->
  <g transform="translate(50, 40)">
    <rect width="280" height="150" class="glass-card" />
    <text x="20" y="35" class="text-title">MISSION PROGRESS</text>
    <text x="20" y="55" class="text-sub">Digitalizing Nepal</text>
    
    <text x="20" y="90" class="text-title">75%</text>
    <rect x="20" y="105" width="240" height="8" class="bar-bg" />
    <rect x="20" y="105" width="220" height="8" class="bar-fill-1" />
  </g>

  <!-- Card 2: Learning Progress -->
  <g transform="translate(360, 40)">
    <rect width="280" height="150" class="glass-card" />
    <text x="20" y="35" class="text-title">CURRENT FOCUS</text>
    <text x="20" y="55" class="text-sub">LLM Orchestration &amp; AI</text>
    
    <text x="20" y="90" class="text-title">90%</text>
    <rect x="20" y="105" width="240" height="8" class="bar-bg" />
    <rect x="20" y="105" width="260" height="8" class="bar-fill-2" />
  </g>

  <!-- Card 3: OSS Contributions -->
  <g transform="translate(670, 40)">
    <rect width="280" height="150" class="glass-card" />
    <text x="20" y="35" class="text-title">OPEN SOURCE</text>
    <text x="20" y="55" class="text-sub">Libraries &amp; Community</text>
    
    <text x="20" y="90" class="text-title">60%</text>
    <rect x="20" y="105" width="240" height="8" class="bar-bg" />
    <rect x="20" y="105" width="180" height="8" class="bar-fill-3" />
  </g>

</svg>
